name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: tools/goja-runner/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Tag must match plugin.json version
        run: |
          version=$(node -p "require('./apps/siyuan/plugin.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match plugin.json version $version" >&2
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The SiYuan bazaar installs the package.zip attached to the latest release.
      - uses: softprops/action-gh-release@v2
        with:
          files: apps/siyuan/package.zip
          body_path: CHANGELOG.md
