name: Release

# One release carries both plugins. The tag is the bare version ("0.1.0"):
# Obsidian looks releases up by exact tag, and the SiYuan bazaar takes
# package.zip from the latest release.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  # Build provenance for the release assets (checked by Obsidian's review).
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: tools/goja-runner/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Tag must match both plugins' versions
        run: node tools/check-release.mjs "$GITHUB_REF_NAME"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Release notes: the newest section of the changelog.
      - run: awk '/^## /{n++} n==1' CHANGELOG.md > release-notes.md
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            apps/siyuan/package.zip
            apps/obsidian/dist/main.js
            apps/obsidian/dist/manifest.json
            apps/obsidian/dist/styles.css
      # SiYuan installs package.zip; Obsidian installs main.js, manifest.json and styles.css.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/siyuan/package.zip
            apps/obsidian/dist/main.js
            apps/obsidian/dist/manifest.json
            apps/obsidian/dist/styles.css
          body_path: release-notes.md
