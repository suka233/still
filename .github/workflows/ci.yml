name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: tools/goja-runner/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Unit tests plus kernel.js end-to-end inside goja (the engine SiYuan embeds).
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: still-siyuan-package
          path: apps/siyuan/package.zip
