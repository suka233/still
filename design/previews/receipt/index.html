<!doctype html>
<html lang="zh-CN" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>续了么 · 小票风格</title>
<style>
:root{--bg:#f2f1ee;--bar:#ffffffcc;--ink:#18181b;--ink2:#71717a;--line:#e4e4e7;--pill:#18181b;--pill-ink:#fff;--chip:#ececeb}
[data-mode=dark]{--bg:#0b0b0c;--bar:#151517cc;--ink:#f4f4f5;--ink2:#9a9aa3;--line:#27272a;--pill:#f4f4f5;--pill-ink:#111;--chip:#202023}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
body{font:14px/1.4 system-ui,-apple-system,"PingFang SC",sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden;transition:background .4s,color .4s}
nav{position:relative;z-index:2;display:flex;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-style:normal;font-size:12px}
/* style switcher with a sliding pill */
.tabs{position:relative;display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--chip);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .pill{position:absolute;top:3px;bottom:3px;left:0;border-radius:999px;background:var(--pill);transition:transform .45s cubic-bezier(.34,1.3,.64,1),width .45s cubic-bezier(.34,1.3,.64,1);pointer-events:none}
.tabs button{position:relative;z-index:1;display:flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;color:var(--ink2);white-space:nowrap;transition:color .3s}
.tabs button kbd{font:600 10px ui-monospace,monospace;opacity:.55}
.tabs button[aria-pressed=true]{color:var(--pill-ink)}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.hint{font-size:12px;color:var(--ink2);white-space:nowrap}
.icon{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--chip);font-size:12.5px;transition:transform .15s,background .2s}
.icon:hover{transform:translateY(-1px)}.icon:active{transform:scale(.96)}
.icon svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
#replay:hover svg{transform:rotate(-200deg)}
#mode .sun{display:none}[data-mode=dark] #mode .sun{display:block}[data-mode=dark] #mode .moon{display:none}
/* stacked frames cross-fade */
.frames{position:relative;flex:1}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transform:scale(.985) translateY(8px);pointer-events:none;transition:opacity .45s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
.frames iframe.on{opacity:1;transform:none;pointer-events:auto}
::view-transition-old(root){animation:none}
::view-transition-new(root){animation:reveal .6s cubic-bezier(.65,0,.35,1)}
@keyframes reveal{from{clip-path:circle(0 at var(--vx) var(--vy))}to{clip-path:circle(150vmax at var(--vx) var(--vy))}}
@media (max-width:760px){.hint{display:none}.tabs button kbd{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:1ms!important;animation-duration:1ms!important}}
</style>
</head>
<body>
<nav>
  <div class="brand"><i>续</i>小票风格</div>
  <div class="tabs" role="tablist">
    <span class="pill" aria-hidden="true"></span>
    <button data-f="r1-thermal"><kbd>1</kbd>热敏</button>
    <button data-f="r2-boutique"><kbd>2</kbd>精品店</button>
    <button data-f="r3-ticket"><kbd>3</kbd>票根</button>
    <button data-f="r4-riso"><kbd>4</kbd>孔版印刷</button>
    <button data-f="r5-swiss"><kbd>5</kbd>极简</button>
  </div>
  <div class="tools">
    <span class="hint">点卡片上的「续 / 不续了 / 再想想」试试</span>
    <button class="icon" id="replay" title="重播 (R)"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>重播</button>
    <button class="icon" id="mode" title="深浅色 (D)"><svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>深色</span></button>
  </div>
</nav>
<div class="frames" id="frames"></div>
<script>
const root=document.documentElement,btns=[...document.querySelectorAll(".tabs button")],pill=document.querySelector(".pill"),frames=document.getElementById("frames");
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const cache={};let current=-1;
const dark=()=>root.dataset.mode==="dark";
function movePill(){const b=btns[current];if(!b)return;pill.style.width=b.offsetWidth+"px";pill.style.transform=`translateX(${b.offsetLeft-3}px)`;b.scrollIntoView({block:"nearest",inline:"nearest"})}
function show(i){
  if(i===current)return;
  current=i;
  btns.forEach((b,j)=>b.setAttribute("aria-pressed",i===j));
  movePill();
  const name=btns[i].dataset.f;
  let f=cache[name];
  if(f){f.contentWindow.postMessage({type:"mode",mode:root.dataset.mode},"*");f.contentWindow.postMessage({type:"replay"},"*")}
  else{f=cache[name]=document.createElement("iframe");f.title=btns[i].textContent;f.src=`${name}.html?embed${dark()?"&dark":""}`;frames.append(f)}
  requestAnimationFrame(()=>Object.values(cache).forEach(x=>x.classList.toggle("on",x===f)));
  history.replaceState(null,"","#"+name);
}
btns.forEach((b,i)=>b.onclick=()=>show(i));
function toggleMode(e){
  const m=dark()?"light":"dark";
  const r=document.getElementById("mode").getBoundingClientRect();
  const x=e?.clientX||r.left+r.width/2,y=e?.clientY||r.top+r.height/2;
  const apply=()=>{root.dataset.mode=m;document.querySelector("#mode span").textContent=m==="dark"?"浅色":"深色"};
  root.style.setProperty("--vx",x+"px");root.style.setProperty("--vy",y+"px");
  if(document.startViewTransition&&!RM)document.startViewTransition(apply);else apply();
  /* every page reveals from the same corner */
  Object.values(cache).forEach(f=>{const fr=f.getBoundingClientRect();f.contentWindow.postMessage({type:"mode",mode:m,origin:{x:x-fr.left,y:Math.max(0,y-fr.top)}},"*")});
}
document.getElementById("mode").onclick=toggleMode;
document.getElementById("replay").onclick=()=>{const f=cache[btns[current].dataset.f];f?.contentWindow.postMessage({type:"replay"},"*")};
addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="ArrowRight")show((current+1)%btns.length);
  else if(e.key==="ArrowLeft")show((current+btns.length-1)%btns.length);
  else if(/^[1-5]$/.test(e.key))show(+e.key-1);
  else if(e.key==="r"||e.key==="R")document.getElementById("replay").click();
  else if(e.key==="d"||e.key==="D")toggleMode();
});
addEventListener("resize",movePill);
if(matchMedia("(prefers-color-scheme: dark)").matches){root.dataset.mode="dark";document.querySelector("#mode span").textContent="浅色"}
show(Math.max(0,btns.findIndex(b=>"#"+b.dataset.f===location.hash)));
/* keys pressed inside a frame still drive the switcher */
addEventListener("message",e=>{if(e.data?.type==="key")dispatchEvent(new KeyboardEvent("keydown",{key:e.data.key}))});
</script>
</body>
</html>
