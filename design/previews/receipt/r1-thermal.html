<!doctype html>
<html lang="zh-CN" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小票 R1 · 热敏</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--desk:#e6e3dd;--paper:#fcfbf8;--ink:#1c1c1e;--ink2:#75716a;--rule:#bdb8ae;--hot:#d23a1f;--keep:#1f7a3d;--shadow:rgb(40 30 10/.22);--slot:#2b2b2e;--blend:multiply}
[data-mode=dark]{--desk:#0d0d0e;--paper:#1e1e21;--ink:#ecebe6;--ink2:#8e8a83;--rule:#45423e;--hot:#ff6b4f;--keep:#6fcf8e;--shadow:rgb(0 0 0/.6);--slot:#000;--blend:screen}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
body{background:var(--desk);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}

/* preview chrome */
.bar{max-width:900px;margin:0 auto;padding:28px 24px 0;display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}
.bar h1{font-size:18px;font-weight:700}.bar p{font-size:13px;color:var(--ink2);margin-top:4px;max-width:600px;line-height:1.6}
.seg{display:flex;border:1px solid var(--rule);border-radius:999px;padding:3px}
.seg button{padding:5px 14px;border-radius:999px;font-size:12px;color:var(--ink2)}.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.stage{max-width:900px;margin:0 auto;padding:28px 24px 64px;display:flex;flex-wrap:wrap;gap:44px;align-items:flex-start;justify-content:center}
.lab{font:600 11px system-ui,sans-serif;letter-spacing:.08em;color:var(--ink2);margin:0 0 12px 2px}
.dock-w{width:300px}.card-w{width:360px}

/* ── the printer: paper feeds out of a slot ── */
.slot{position:relative;z-index:2;height:14px;margin:0 -12px;border-radius:7px;background:linear-gradient(#3b3b3f,var(--slot));box-shadow:inset 0 1px 0 rgb(255 255 255/.08),0 8px 12px -6px rgb(0 0 0/.5)}
.slot::after{content:"";position:absolute;left:10px;right:10px;top:6px;height:2px;border-radius:1px;background:#000}
.feed{overflow:hidden;margin:-7px -14px 0;padding:0 14px 34px}

/* ── thermal paper ── */
.shadow{filter:drop-shadow(0 14px 18px var(--shadow))}
.paper{
  position:relative;background:var(--paper);color:var(--ink);
  font:400 12.5px/1.6 "JetBrains Mono","Noto Sans SC",ui-monospace,monospace;
  padding:24px 18px 28px;
  -webkit-mask:
    conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/12px 51% repeat-x,
    conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/12px 51% repeat-x;
          mask:
    conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/12px 51% repeat-x,
    conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/12px 51% repeat-x;
  font-variant-numeric:tabular-nums;
}
.c{text-align:center}
.brand{font-weight:800;letter-spacing:.12em}
.small{font-size:11px;color:var(--ink2)}
.rule{border-top:1.5px dashed var(--rule);margin:12px 0}
.rule.dbl{border-top:3px double var(--ink);opacity:.8}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:2px 0 4px}
.meter{letter-spacing:-.5px;color:var(--ink2);font-size:11px;white-space:nowrap}
.add{position:absolute;right:14px;top:16px;font-size:11px;font-weight:700;border:1.5px solid var(--ink);padding:1px 6px}
.add:hover{background:var(--ink);color:var(--paper)}

.inv{display:flex;align-items:center;gap:10px;width:100%;background:var(--ink);color:var(--paper);padding:9px 10px;margin:14px 0 4px;text-align:left;transition:background .25s,color .25s}
.inv b{font-size:22px;font-weight:800;line-height:1;min-width:14px;text-align:center}
.inv>span{flex:1;min-width:0}.inv small{display:block;font-size:11px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv:hover{background:var(--hot)}
.inv.done{background:transparent;color:var(--keep);box-shadow:inset 0 0 0 1.5px var(--keep)}

.sec{display:flex;align-items:center;gap:8px;margin:16px 0 4px;font-weight:700;font-size:11.5px}
.sec::before{content:"■";font-size:8px}
.sec::after{content:"";flex:1;border-top:1.5px dashed var(--rule)}
.sec em{font-style:normal;color:var(--ink2);font-weight:400;order:2}

.item{padding:6px 0;border-radius:2px;cursor:pointer;transition:opacity .4s}
.item+.item{border-top:1px dotted var(--rule)}
.item:hover .nm{text-decoration:underline;text-underline-offset:3px}
.l1,.l2{display:flex;justify-content:space-between;gap:10px}
.nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{font-weight:700;white-space:nowrap}
.l2{font-size:11px;color:var(--ink2)}
.tag{font-style:normal;border:1px solid currentColor;padding:0 3px;margin-left:2px}
.cd{white-space:nowrap}
.hot .cd{background:var(--hot);color:var(--paper);padding:0 5px;font-weight:700}
.hot .tag{color:var(--hot)}
.is-cancel{opacity:.5}
.is-cancel .cd{background:transparent;color:var(--ink2)}
.mk{margin-left:6px;padding:0 4px;font-weight:700;font-size:10.5px;border:1px solid currentColor}
.mk-keep{color:var(--keep)}.mk-cancel{color:var(--hot)}.mk-later{color:var(--ink2)}

.tot{display:flex;justify-content:space-between;font-weight:700}
.barcode{height:38px;margin:14px 6px 6px;color:var(--ink)}.barcode svg{width:100%;height:100%}
.link{display:block;margin:8px auto 0;font-size:12px;font-weight:700;border-bottom:1.5px solid var(--ink)}
.link:hover{color:var(--hot);border-color:var(--hot)}

/* card */
.card .ttl{font-family:"Noto Sans SC",sans-serif;font-size:20px;font-weight:900;line-height:1.3;margin:6px 0 2px}
.kv div{display:flex;justify-content:space-between;padding:2px 0}
.kv dt{color:var(--ink2)}
.kv .hl{color:var(--hot);font-weight:700}
.grand{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.grand b{font-size:24px;letter-spacing:-.02em}
.ask{text-align:center;font-weight:700;margin:16px 0 10px}
.btns{display:flex;gap:10px}
.btn{flex:1;height:48px;border:2px solid var(--ink);font-weight:800;font-size:15px;letter-spacing:.08em;display:grid;place-items:center;line-height:1.1;transition:transform .12s,border-color .15s,color .15s}
.btn small{display:block;font-size:9.5px;font-weight:500;letter-spacing:.2em;opacity:.7}
.btn.keep{background:var(--ink);color:var(--paper)}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(1px)}
.btn.drop:hover{border-color:var(--hot);color:var(--hot)}
.later{display:block;margin:12px auto 0;font-size:12px;color:var(--ink2)}
.later:hover{color:var(--ink)}
/* rubber stamp */
.stamp{position:absolute;left:50%;top:54%;z-index:3;padding:6px 18px 4px;border:3px double currentColor;border-radius:4px;font:900 28px/1.1 "Noto Sans SC",sans-serif;letter-spacing:.14em;text-align:center;mix-blend-mode:var(--blend);pointer-events:none;transform:translate(-50%,-50%) rotate(-10deg);background:color-mix(in oklab,currentColor 7%,transparent)}
.stamp small{display:block;font:700 10px "JetBrains Mono",monospace;letter-spacing:.32em}
.s-keep{color:var(--keep)}.s-cancel{color:var(--hot)}.s-later{color:var(--ink2)}
.kv.sum dd{font-weight:700}
/*<motion-core-css>*/
.stage{visibility:hidden}
.embedded .seg{display:none}
.mk{display:inline-block;font-style:normal;white-space:nowrap;animation:mk-in .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes mk-in{from{transform:scale(.3) rotate(-14deg);opacity:0}}
[data-pcount]{display:inline-block}
/* strike-through drawn left to right on cancelled rows */
.st{background:linear-gradient(currentColor,currentColor) no-repeat 0 56%/0 1.5px;transition:background-size .5s cubic-bezier(.65,0,.35,1)}
.is-cancel .st{background-size:100% 1.5px}
::view-transition-old(root){animation:none}
::view-transition-new(root){animation:vt-reveal .6s cubic-bezier(.65,0,.35,1)}
@keyframes vt-reveal{from{clip-path:circle(0 at var(--vx,100%) var(--vy,0))}to{clip-path:circle(150vmax at var(--vx,100%) var(--vy,0))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}}
/*</motion-core-css>*/
</style>
</head>
<body>
<header class="bar">
  <div>
    <h1>R1 · 热敏小票</h1>
    <p>超市收银机的热敏纸：小票从打印口一格一格吐出来。做决定会盖一个章，这张小票被撕走，下一张接着打。</p>
  </div>
  <div class="seg"><button data-m="light">浅色</button><button data-m="dark">深色</button></div>
</header>

<main class="stage">
  <section class="dock-w">
    <div class="lab">侧栏 DOCK</div>
    <div class="slot"></div>
    <div class="feed"><div class="shadow"><div class="paper" id="dock"></div></div></div>
  </section>
  <section class="card-w">
    <div class="lab">续费决定卡</div>
    <div class="slot"></div>
    <div class="feed"><div class="shadow"><div class="paper card" id="card"></div></div></div>
  </section>
</main>

<script>
const SUBS=[
  {n:"ChatGPT Plus",p:"US$20.00",d:"10-05",t:1,cyc:"每月",trial:true,g:0},
  {n:"Netflix",p:"US$15.49",d:"10-06",t:2,cyc:"每月",g:0},
  {n:"Spotify Premium",p:"US$11.99",d:"10-09",t:5,cyc:"每月",g:0},
  {n:"iCloud+",p:"¥21.00",d:"10-16",t:12,cyc:"每月",g:1},
  {n:"GitHub Copilot",p:"US$10.00",d:"10-22",t:18,cyc:"每月",g:1},
  {n:"B 站大会员",p:"¥148.00",d:"11-13",t:40,cyc:"每年",g:2},
  {n:"Notion Plus",p:"US$96.00",d:"01-07",t:95,cyc:"每年",g:2},
  {n:"域名 still.app",p:"US$14.00",d:"03-03",t:150,cyc:"每年",g:2},
];
const GROUPS=["7 天内","30 天内","更晚"];
const when=t=>t===1?"明天":t===2?"后天":`${t} 天后`;
function barcode(seed,w=220){let x=0,s=seed,r="";while(x<w){s=(s*9301+49297)%233280;const bw=1+(s%3);if((s>>4)%3)r+=`<rect x="${x}" width="${bw}" height="40"/>`;x+=bw+1}
  return `<svg viewBox="0 0 ${x} 40" preserveAspectRatio="none" fill="currentColor">${r}</svg>`}

const dockHTML=()=>`
  <button class="add">+ 添加</button>
  <div class="c brand">续了么 · STILL</div>
  <div class="c small">订阅续费单 · 2026-10-04 周日</div>
  <div class="rule dbl"></div>
  <div class="c small">本月还要付</div>
  <div class="c big">≈¥<span data-num>407.27</span></div>
  <div class="c meter">已付 ${"░".repeat(18)} 0%</div>
  <div class="c small">本月共 ≈¥407.27 · 已付 ¥0.00</div>
  <button class="inv" data-pending><b data-pcount>2</b><span><span data-ptext>个续费等你决定</span><small data-pnames>ChatGPT Plus、Netflix</small></span>›</button>
  ${GROUPS.map((g,i)=>{const list=SUBS.filter(s=>s.g===i);return `
    <div class="sec">${g}<em>${list.length} 项</em></div>
    ${list.map(s=>`
      <div class="item ${s.t<=2?"hot":""}" data-row="${s.n}">
        <div class="l1"><span class="nm"><span class="st">${s.n}</span></span><span class="pr st">${s.p}</span></div>
        <div class="l2"><span data-mark>${s.d} · ${s.cyc}${s.trial?' <i class="tag">试用</i>':""}</span><span class="cd">${when(s.t)}</span></div>
      </div>`).join("")}`}).join("")}
  <div class="rule dbl"></div>
  <div class="tot"><span>月均支出</span><span>≈¥<span data-monthly>481.22</span></span></div>
  <div class="barcode">${barcode(7)}</div>
  <div class="c small">* 用得着，再续 *</div>
  <button class="link">查看全部账目 →</button>`;

const cardHTML=(it)=>`
  <div class="c brand">*** 续费提醒 ***</div>
  <div class="c small">RENEWAL NOTICE · 第 ${demo.index+1} / ${demo.total} 笔</div>
  <div class="rule dbl"></div>
  <div class="ttl">${titleOf(it)}</div>
  <div class="small">${subOf(it)}</div>
  <div class="rule"></div>
  <dl class="kv">
    <div><dt>扣费日</dt><dd class="hl">2026-${it.day} · ${it.when}</dd></div>
    <div><dt>周期</dt><dd>${it.cyc}</dd></div>
    <div><dt>状态</dt><dd>${statusOf(it)}</dd></div>
  </dl>
  <div class="rule"></div>
  <div class="grand"><span>${chargeOf(it)}</span><b>${it.p}</b></div>
  <div class="ask">— 这一笔，还续吗？ —</div>
  <div class="btns">
    <button class="btn keep" data-choice="keep"><span>续<small>KEEP</small></span></button>
    <button class="btn drop" data-choice="cancel"><span>不续了<small>DROP</small></span></button>
  </div>
  <button class="later" data-choice="later">再想想 · 稍后提醒我</button>
  <div class="barcode" style="height:30px">${barcode(31+demo.index*17)}</div>
  <div class="c small">No. ${it.n.split(" ")[0].toUpperCase()}-2026${it.day.replace("-","")}</div>`;

const doneHTML=()=>`
  <div class="c brand">*** 全部处理完毕 ***</div>
  <div class="c small">ALL DONE · ${demo.total} / ${demo.total} 笔</div>
  <div class="rule dbl"></div>
  <dl class="kv sum">
    <div><dt>续</dt><dd>${demo.tally.keep} 笔</dd></div>
    <div><dt>不续了</dt><dd>${demo.tally.cancel} 笔</dd></div>
    <div><dt>再想想</dt><dd>${demo.tally.later} 笔</dd></div>
  </dl>
  <div class="rule"></div>
  <div class="grand"><span>每月省下</span><b>${savedText()}</b></div>
  <div class="barcode" style="height:30px">${barcode(97)}</div>
  <button class="link" data-replay>↻ 再打印一遍</button>`;

/* paper feeds out of the slot in stepper-motor ticks */
function feed(sheet,speed=1){const h=sheet.offsetHeight;return play(sheet,[{transform:"translateY(-100%)"},{transform:"none"}],{duration:Math.min(1900,h*speed),easing:`steps(${Math.max(8,Math.round(h/22))},end)`})}
window.dockIn=()=>feed($("#dock").closest(".shadow"),1.15);
window.cardIn=(first)=>feed($("#card").closest(".shadow"),first?1.15:.95);
const STAMP={keep:["已续","RENEWED"],cancel:["不续了","CANCELLED"],later:["再想想","LATER"]};
window.cardFx=async(choice)=>{
  const paper=$("#card"),sheet=paper.closest(".shadow");
  paper.insertAdjacentHTML("beforeend",`<div class="stamp s-${choice}">${STAMP[choice][0]}<small>${STAMP[choice][1]}</small></div>`);
  await play($(".stamp",paper),[
    {transform:"translate(-50%,-50%) scale(2.4) rotate(-16deg)",opacity:0},
    {transform:"translate(-50%,-50%) scale(.93) rotate(-10deg)",opacity:1,offset:.6},
    {transform:"translate(-50%,-50%) scale(1) rotate(-10deg)",opacity:1}],{duration:360,easing:EASE.in,fill:"forwards"});
  play(sheet,[{transform:"none"},{transform:"translate(1px,2px)"},{transform:"translate(-1px,0)"},{transform:"none"}],{duration:170,easing:"linear"});
  await wait(560);
  /* tear it off: a little tug, then away */
  await play(sheet,[{transform:"none",opacity:1},{transform:"translateY(5px) rotate(-.6deg)",opacity:1,offset:.2},{transform:"translate(30px,90px) rotate(8deg)",opacity:0}],{duration:560,easing:EASE.in,fill:"forwards"});
};
window.rowFx=(row,choice)=>choice==="keep"&&play(row,[{background:"color-mix(in oklab, var(--keep) 18%, transparent)"},{background:"transparent"}],{duration:1100});
/*<motion-core> shared by every receipt preview; each page defines dockHTML/cardHTML/doneHTML and dockIn/cardIn/cardFx/rowFx */
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const wait = (ms) => new Promise((r) => setTimeout(r, RM ? 0 : ms));
const EASE = { out: "cubic-bezier(.2,.8,.2,1)", back: "cubic-bezier(.34,1.56,.64,1)", in: "cubic-bezier(.55,0,.75,.2)", io: "cubic-bezier(.65,0,.35,1)" };
/* Enter animations fill backwards (they hand back to the stylesheet when done); exits pass fill:"forwards". */
function play(el, kf, opts = {}) {
  if (!el) return Promise.resolve();
  const a = el.animate(kf, { duration: 420, easing: EASE.out, fill: "backwards", ...opts, ...(RM ? { duration: 1, delay: 0 } : {}) });
  return a.finished.then(() => a, () => a);
}
const stagger = (els, kf, { gap = 40, delay = 0, ...o } = {}) => Promise.all([...els].map((el, i) => play(el, kf, { ...o, delay: delay + i * gap })));
const fmtNum = (v) => v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function countTo(el, from, to, ms = 900) {
  if (RM) { el.textContent = fmtNum(to); return Promise.resolve(); }
  return new Promise((res) => {
    const t0 = performance.now();
    const tick = (t) => { const k = Math.min(1, (t - t0) / ms); el.textContent = fmtNum(from + (to - from) * (1 - Math.pow(1 - k, 4))); k < 1 ? requestAnimationFrame(tick) : res(); };
    requestAnimationFrame(tick);
  });
}

/* Demo data: the two renewals waiting for a decision */
const RATE = { "US$": 7.12, "¥": 1 };
const cny = (p) => { const m = /^(US\$|¥)([\d.]+)$/.exec(p); return m ? +m[2] * RATE[m[1]] : 0; };
const PENDING = [
  { n: "ChatGPT Plus", b: "#10a37f", l: "C", p: "US$20.00", day: "10-05", dayZh: "10 月 5 日", when: "明天", cyc: "每月", trial: true },
  { n: "Netflix", b: "#e50914", l: "N", p: "US$15.49", day: "10-06", dayZh: "10 月 6 日", when: "后天", cyc: "每月", trial: false },
];
const titleOf = (it) => (it.trial ? `${it.n} 的试用快结束了` : `还在用 ${it.n} 吗？`);
const subOf = (it) => (it.trial ? `${it.when}试用结束，并开始第一次扣费` : `${it.when}自动续费，每月 ${it.p}`);
const statusOf = (it) => (it.trial ? "试用中" : "生效中");
const chargeOf = (it) => (it.trial ? "首次扣费" : "本次扣费");
const MARK = { keep: "已续", cancel: "已取消", later: "稍后" };
const demo = {};
function resetDemo() {
  Object.assign(demo, { remaining: 407.27, monthly: 481.22, queue: PENDING.slice(), index: 0, total: PENDING.length, busy: false, tally: { keep: 0, cancel: 0, later: 0, saved: 0 } });
}
const tallyText = () => [demo.tally.keep && `续 ${demo.tally.keep}`, demo.tally.cancel && `不续 ${demo.tally.cancel}`, demo.tally.later && `稍后 ${demo.tally.later}`].filter(Boolean).join(" · ");
const savedText = () => `≈¥${fmtNum(demo.tally.saved)}`;

/* A decision ripples into the dock: the row, the totals and the pending banner */
async function applyDecision(item, choice) {
  demo.tally[choice]++;
  const jobs = [];
  if (choice === "cancel") {
    const v = cny(item.p);
    demo.tally.saved += v;
    $$("[data-num]").forEach((el) => jobs.push(countTo(el, demo.remaining, demo.remaining - v)));
    $$("[data-monthly]").forEach((el) => jobs.push(countTo(el, demo.monthly, demo.monthly - v)));
    demo.remaining -= v;
    demo.monthly -= v;
  }
  const row = $(`[data-row="${item.n}"]`);
  if (row) {
    row.classList.add("is-" + choice);
    ($("[data-mark]", row) || row).insertAdjacentHTML("beforeend", `<i class="mk mk-${choice}">${MARK[choice]}</i>`);
    jobs.push(Promise.resolve(window.rowFx?.(row, choice, item)));
  }
  jobs.push(updatePending());
  await Promise.all(jobs);
}
async function updatePending() {
  const banner = $("[data-pending]");
  if (!banner) return;
  const left = demo.queue.slice(1);
  const count = $("[data-pcount]", banner);
  await play(count, [{ transform: "none", opacity: 1 }, { transform: "translateY(-80%)", opacity: 0 }], { duration: 170, easing: EASE.in, fill: "forwards" });
  if (left.length) {
    count.textContent = left.length;
    $("[data-pnames]", banner).textContent = left.map((x) => x.n).join("、");
  } else {
    banner.classList.add("done");
    count.textContent = "✓";
    $("[data-ptext]", banner).textContent = "都处理好了";
    $("[data-pnames]", banner).textContent = tallyText();
  }
  count.getAnimations().forEach((a) => a.cancel());
  await play(count, [{ transform: "translateY(80%)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 340, easing: EASE.back });
}

async function decide(choice, btn) {
  if (demo.busy || !demo.queue.length) return;
  demo.busy = true;
  const item = demo.queue[0];
  const fx = applyDecision(item, choice);
  await window.cardFx(choice, btn, item);
  demo.queue.shift();
  demo.index++;
  renderCard();
  $(".card-w").getAnimations({ subtree: true }).forEach((a) => a.cancel());
  await Promise.all([window.cardIn(false), fx]);
  demo.busy = false;
}
function renderCard() {
  const el = $("#card");
  el.innerHTML = demo.queue.length ? cardHTML(demo.queue[0]) : doneHTML();
  $$("[data-choice]", el).forEach((b) => (b.onclick = () => decide(b.dataset.choice, b)));
  $("[data-replay]", el)?.addEventListener("click", () => replay());
}
const nudge = (el) => play(el, [{ transform: "none" }, { transform: "translateX(-7px)" }, { transform: "translateX(6px)" }, { transform: "translateX(-3px)" }, { transform: "none" }], { duration: 420, easing: "linear" });
async function replay() {
  resetDemo();
  document.getAnimations().forEach((a) => a.cancel());
  $("#dock").innerHTML = dockHTML();
  $("[data-pending]")?.addEventListener("click", () => nudge($(".card-w")));
  renderCard();
  $(".stage").style.visibility = "visible";
  $$("[data-num]").forEach((el) => countTo(el, 0, demo.remaining, 1100));
  $$("[data-monthly]").forEach((el) => countTo(el, 0, demo.monthly, 1100));
  await Promise.all([window.dockIn(), window.cardIn(true)]);
}

/* Light/dark with a circular reveal from wherever the switch happened */
const root = document.documentElement;
const params = new URLSearchParams(location.search);
if (window.top !== window || params.has("embed")) root.classList.add("embedded");
function setMode(m, origin) {
  const apply = () => { root.dataset.mode = m; $$(".seg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.m === m)); };
  if (root.dataset.mode === m || !document.startViewTransition || RM) return apply();
  root.style.setProperty("--vx", origin ? origin.x + "px" : "100%");
  root.style.setProperty("--vy", origin ? origin.y + "px" : "0px");
  document.startViewTransition(apply);
}
$$(".seg button").forEach((b) => (b.onclick = (e) => setMode(b.dataset.m, { x: e.clientX, y: e.clientY })));
addEventListener("message", (e) => {
  const d = e.data || {};
  if (d.type === "mode") setMode(d.mode, d.origin);
  if (d.type === "replay") replay();
});
/* inside the index page, shortcut keys go to the switcher */
if (root.classList.contains("embedded")) addEventListener("keydown", (e) => {
  if (!e.metaKey && !e.ctrlKey && !e.altKey && /^(ArrowLeft|ArrowRight|[1-5]|r|R|d|D)$/.test(e.key)) parent.postMessage({ type: "key", key: e.key }, "*");
});
root.dataset.mode = params.has("dark") ? "dark" : "light";
$$(".seg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.m === root.dataset.mode));
Promise.race([document.fonts.ready, wait(800)]).then(replay);
/*</motion-core>*/
</script>
