<!doctype html>
<html lang="zh-CN" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小票 R2 · 精品店</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--desk:#e8e2d6;--paper:#fdfaf4;--ink:#2a2521;--ink2:#8b8174;--hair:#e7dfd1;--accent:#8e2f3a;--keep:#2f4a3c;--gold:#a8823f;--shadow:rgb(60 40 20/.16)}
[data-mode=dark]{--desk:#11100e;--paper:#1f1b18;--ink:#efe6d7;--ink2:#9a8f80;--hair:#352f29;--accent:#e08a7c;--keep:#c9a66b;--gold:#c9a66b;--shadow:rgb(0 0 0/.6)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
body{background:var(--desk);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}

.bar{max-width:900px;margin:0 auto;padding:28px 24px 0;display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}
.bar h1{font-size:18px;font-weight:700}.bar p{font-size:13px;color:var(--ink2);margin-top:4px;max-width:600px;line-height:1.6}
.seg{display:flex;border:1px solid var(--hair);border-radius:999px;padding:3px}
.seg button{padding:5px 14px;border-radius:999px;font-size:12px;color:var(--ink2)}.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.stage{max-width:900px;margin:0 auto;padding:28px 24px 64px;display:flex;flex-wrap:wrap;gap:44px;align-items:flex-start;justify-content:center}
.lab{font:600 11px system-ui,sans-serif;letter-spacing:.08em;color:var(--ink2);margin:0 0 12px 2px}
.dock-w{width:300px}.card-w{width:360px;perspective:1100px}

/* ── boutique paper ── */
.shadow{filter:drop-shadow(0 1px 1px var(--shadow)) drop-shadow(0 16px 22px var(--shadow));transform-origin:50% 0}
.paper{
  position:relative;color:var(--ink);padding:28px 22px 34px;
  font:400 13px/1.55 "Noto Serif SC","Songti SC",serif;
  background:var(--paper) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .3  0 0 0 0 .2  0 0 0 .07 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  -webkit-mask:radial-gradient(6px at 50% 100%,#0000 97%,#000) bottom/14px 100% repeat-x;
          mask:radial-gradient(6px at 50% 100%,#0000 97%,#000) bottom/14px 100% repeat-x;
}
.num{font-family:"Fraunces",serif;font-variant-numeric:tabular-nums lining-nums;font-optical-sizing:auto}
.cap{font:500 10px/1.4 "Inter",sans-serif;letter-spacing:.2em;color:var(--ink2);text-transform:uppercase}
.c{text-align:center}

.seal{width:46px;height:46px;margin:0 auto 8px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:20px;font-weight:700;position:relative}
.seal::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1px solid var(--accent);opacity:.35}
.add{position:absolute;right:16px;top:16px;font:500 11px "Inter",sans-serif;color:var(--ink2);border:1px solid var(--hair);border-radius:999px;padding:3px 10px;background:var(--paper)}
.add:hover{color:var(--ink);border-color:var(--ink2)}

.amount{font-size:40px;font-weight:350;letter-spacing:-.02em;line-height:1.05;margin:14px 0 2px}
.amount small{font-size:.48em;vertical-align:.7em;margin-right:2px;color:var(--ink2)}
.amount .ap{font-size:.45em;color:var(--ink2);margin-right:4px;vertical-align:.6em}
.prog{position:relative;height:1px;background:var(--hair);margin:16px 0 8px}
.prog i{position:absolute;left:0;top:-1px;height:3px;width:2%;background:var(--ink)}
.prog::after{content:"";position:absolute;left:2%;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--paper);border:1px solid var(--ink)}
.progm{display:flex;justify-content:space-between;font:400 11px "Inter",sans-serif;color:var(--ink2)}

.pend{display:flex;align-items:center;gap:12px;width:100%;margin:22px 0 4px;padding:12px 14px;text-align:left;border:1px solid color-mix(in oklab,var(--accent) 35%,transparent);background:color-mix(in oklab,var(--accent) 6%,transparent);border-radius:3px;transition:background .3s,border-color .3s}
.pend:hover{background:color-mix(in oklab,var(--accent) 11%,transparent)}
.pend .n{font-size:30px;font-style:italic;font-weight:400;color:var(--accent);line-height:1;min-width:16px;text-align:center}
.pend>span{flex:1;min-width:0;font-size:14px;font-weight:500}
.pend small{display:block;font:italic 400 12px "Fraunces","Noto Serif SC",serif;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pend .go{color:var(--accent);font-family:"Inter";font-size:16px}
.pend.done{border-color:color-mix(in oklab,var(--keep) 35%,transparent);background:color-mix(in oklab,var(--keep) 6%,transparent)}
.pend.done .n,.pend.done .go{color:var(--keep)}

.sec{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:6px;margin:24px 0 0}
.row{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair);cursor:pointer;transition:opacity .5s}
.row:hover .nm{color:var(--accent)}
.ic{width:30px;height:30px;border-radius:50%;background:var(--b);color:#fff;display:grid;place-items:center;font:600 12px "Inter",sans-serif;box-shadow:inset 0 0 0 1px rgb(0 0 0/.08);transition:filter .5s}
[data-mode=dark] .ic{box-shadow:inset 0 0 0 1px rgb(255 255 255/.12)}
.nm{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s}
.meta{font:400 11px "Inter",sans-serif;color:var(--ink2);margin-top:1px}
.tag{font-style:normal;font:italic 400 10.5px "Fraunces",serif;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:0 6px;margin-left:4px}
.pr{text-align:right;font-size:15px;font-weight:400;white-space:nowrap}
.cd{font:400 11px "Inter",sans-serif;color:var(--ink2);text-align:right}
.hot .cd{color:var(--accent);font-weight:600}
.hot .cd::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-right:5px;vertical-align:2px}
.is-cancel{opacity:.5}.is-cancel .ic{filter:grayscale(1)}
.is-cancel .cd::before{display:none}
.mk{margin-left:6px;font:italic 400 10.5px "Fraunces","Noto Serif SC",serif;border-radius:999px;padding:0 7px;color:var(--paper)}
.mk-keep{background:var(--keep)}.mk-cancel{background:var(--accent)}.mk-later{background:var(--gold)}

.foot{display:flex;justify-content:space-between;align-items:baseline;margin-top:18px}
.foot .num{font-size:20px;font-weight:400}
.more{display:block;margin:18px auto 0;font:500 12px "Inter",sans-serif;letter-spacing:.04em;color:var(--ink);text-decoration:underline;text-decoration-color:var(--hair);text-underline-offset:5px}
.more:hover{text-decoration-color:var(--ink)}
.sign{margin-top:16px;font:italic 300 13px "Fraunces","Noto Serif SC",serif;color:var(--ink2)}

/* card */
.card .ic{width:52px;height:52px;margin:0 auto 14px;font-size:20px}
.eyebrow{font:italic 400 13px "Fraunces",serif;color:var(--accent)}
.ttl{font-size:22px;font-weight:700;line-height:1.35;margin:6px 0 6px}
.sub{font-size:13px;color:var(--ink2)}
dl{margin:22px 0 0;border-top:1px solid var(--ink)}
dl div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--hair);font-size:13px}
dt{font:400 12px "Inter",sans-serif;color:var(--ink2)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 0}
.total .num{font-size:32px;font-weight:350;letter-spacing:-.01em}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.btn{height:46px;border-radius:999px;font-size:15px;font-weight:500;letter-spacing:.06em;transition:transform .15s,background .15s}
.btn.keep{background:var(--keep);color:var(--paper)}
.btn.drop{border:1px solid var(--accent);color:var(--accent)}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(1px)}.btn.drop:hover{background:color-mix(in oklab,var(--accent) 8%,transparent)}
.later{display:block;margin:14px auto 0;font-size:13px;color:var(--ink2);text-decoration:underline;text-decoration-color:var(--hair);text-underline-offset:5px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:18px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--hair);transition:all .3s}.dots i.on{background:var(--ink);width:16px;border-radius:3px}
/* wax seal pressed onto the slip */
.wax{position:absolute;right:26px;top:43%;z-index:3;width:88px;height:88px;display:grid;place-items:center;pointer-events:none;color:#fff;font:700 19px/1.1 "Noto Serif SC",serif;letter-spacing:.06em;text-align:center;
  border-radius:47% 53% 50% 50%/52% 48% 52% 48%;background:radial-gradient(circle at 34% 30%,color-mix(in oklab,var(--w) 60%,#fff) 0,var(--w) 45%,color-mix(in oklab,var(--w) 70%,#000) 100%);
  box-shadow:inset 0 0 0 5px color-mix(in oklab,var(--w) 80%,#000),inset 0 0 0 6px rgb(255 255 255/.18),inset 0 -4px 8px rgb(0 0 0/.3),0 8px 14px -6px rgb(0 0 0/.45);transform:rotate(-8deg)}
.wax small{display:block;font:italic 400 9px "Fraunces",serif;letter-spacing:.18em;opacity:.85;margin-top:2px}
.wax-ring{position:absolute;right:26px;top:43%;width:88px;height:88px;border-radius:50%;border:2px solid var(--w);pointer-events:none}
.w-keep{--w:var(--keep)}.w-cancel{--w:var(--accent)}.w-later{--w:var(--gold)}
.summary div{font-size:13px}
.summary dd{font-family:"Fraunces",serif}
/*<motion-core-css>*/
.stage{visibility:hidden}
.embedded .seg{display:none}
.mk{display:inline-block;font-style:normal;white-space:nowrap;animation:mk-in .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes mk-in{from{transform:scale(.3) rotate(-14deg);opacity:0}}
[data-pcount]{display:inline-block}
/* strike-through drawn left to right on cancelled rows */
.st{background:linear-gradient(currentColor,currentColor) no-repeat 0 56%/0 1.5px;transition:background-size .5s cubic-bezier(.65,0,.35,1)}
.is-cancel .st{background-size:100% 1.5px}
::view-transition-old(root){animation:none}
::view-transition-new(root){animation:vt-reveal .6s cubic-bezier(.65,0,.35,1)}
@keyframes vt-reveal{from{clip-path:circle(0 at var(--vx,100%) var(--vy,0))}to{clip-path:circle(150vmax at var(--vx,100%) var(--vy,0))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}}
/*</motion-core-css>*/
</style>
</head>
<body>
<header class="bar">
  <div>
    <h1>R2 · 精品店收据</h1>
    <p>香氛店、咖啡馆的厚纸收据：纸张轻轻落在桌上，封印压一下。做决定时在卡片上压一枚火漆印，然后这张收据被收起来。</p>
  </div>
  <div class="seg"><button data-m="light">浅色</button><button data-m="dark">深色</button></div>
</header>

<main class="stage">
  <section class="dock-w">
    <div class="lab">侧栏 DOCK</div>
    <div class="shadow"><div class="paper" id="dock"></div></div>
  </section>
  <section class="card-w">
    <div class="lab">续费决定卡</div>
    <div class="shadow"><div class="paper card" id="card"></div></div>
  </section>
</main>

<script>
const SUBS=[
  {n:"ChatGPT Plus",b:"#10a37f",l:"C",p:"US$20.00",d:"10月5日",t:1,cyc:"每月",trial:true,g:0},
  {n:"Netflix",b:"#e50914",l:"N",p:"US$15.49",d:"10月6日",t:2,cyc:"每月",g:0},
  {n:"Spotify Premium",b:"#1db954",l:"S",p:"US$11.99",d:"10月9日",t:5,cyc:"每月",g:0},
  {n:"iCloud+",b:"#3693f3",l:"i",p:"¥21.00",d:"10月16日",t:12,cyc:"每月",g:1},
  {n:"GitHub Copilot",b:"#24292f",l:"G",p:"US$10.00",d:"10月22日",t:18,cyc:"每月",g:1},
  {n:"B 站大会员",b:"#00a1d6",l:"B",p:"¥148.00",d:"11月13日",t:40,cyc:"每年",g:2},
  {n:"Notion Plus",b:"#191919",l:"N",p:"US$96.00",d:"1月7日",t:95,cyc:"每年",g:2},
  {n:"域名 still.app",b:"#9a9081",l:"域",p:"US$14.00",d:"3月3日",t:150,cyc:"每年",g:2},
];
const GROUPS=["七天之内","三十天内","更晚一些"];
const when=t=>t===1?"明天":t===2?"后天":`${t} 天后`;

const dockHTML=()=>`
  <button class="add">+ 添加</button>
  <div class="c">
    <div class="seal">续</div>
    <div class="cap">Still · 续了么</div>
    <div class="amount num"><span class="ap">≈</span><small>¥</small><span data-num>407.27</span></div>
    <div class="cap" style="letter-spacing:.12em">本月尚需支付</div>
  </div>
  <div class="prog"><i></i></div>
  <div class="progm"><span>已付 ¥0.00</span><span>本月共 ≈ ¥407.27</span></div>
  <button class="pend" data-pending><b class="n num" data-pcount>2</b><span><span data-ptext>笔续费，等你点头</span><small data-pnames>ChatGPT Plus、Netflix</small></span><b class="go">→</b></button>
  ${GROUPS.map((g,i)=>{const list=SUBS.filter(s=>s.g===i);return `
    <div class="sec"><span class="cap" style="color:var(--ink)">${g}</span><span class="cap">${list.length} 项</span></div>
    ${list.map(s=>`
      <div class="row ${s.t<=2?"hot":""}" data-row="${s.n}">
        <span class="ic" style="--b:${s.b}">${s.l}</span>
        <span style="min-width:0"><div class="nm"><span class="st">${s.n}</span></div><div class="meta" data-mark>${s.d} · ${s.cyc}${s.trial?'<i class="tag">试用</i>':""}</div></span>
        <span><div class="pr num st">${s.p}</div><div class="cd">${when(s.t)}</div></span>
      </div>`).join("")}`}).join("")}
  <div class="foot"><span class="cap">月均支出</span><span class="num">≈ ¥<span data-monthly>481.22</span></span></div>
  <button class="more">查看全部账目</button>
  <div class="c sign">— 用得着，再续 —</div>`;

const dots=()=>`<div class="dots">${Array.from({length:demo.total},(_,i)=>`<i class="${i===demo.index?"on":""}"></i>`).join("")}</div>`;
const cardHTML=(it)=>`
  <div class="c">
    <span class="ic" style="--b:${it.b}">${it.l}</span>
    <div class="eyebrow">Renewal notice · 续费通知</div>
    <div class="ttl">${titleOf(it)}</div>
    <div class="sub">${subOf(it)}</div>
  </div>
  <dl>
    <div><dt>扣费日</dt><dd>2026 年 ${it.dayZh} · <b style="color:var(--accent);font-weight:500">${it.when}</b></dd></div>
    <div><dt>周期</dt><dd>${it.cyc}</dd></div>
    <div><dt>状态</dt><dd>${statusOf(it)}</dd></div>
  </dl>
  <div class="total"><span class="cap" style="color:var(--ink)">${chargeOf(it)}</span><span class="num">${it.p}</span></div>
  <div class="btns"><button class="btn keep" data-choice="keep">续订</button><button class="btn drop" data-choice="cancel">不续了</button></div>
  <button class="later" data-choice="later">再想想，稍后提醒我</button>
  ${dots()}`;

const doneHTML=()=>`
  <div class="c">
    <div class="seal" style="border-color:var(--keep);color:var(--keep)">✓</div>
    <div class="eyebrow" style="color:var(--keep)">All settled · 都处理好了</div>
    <div class="ttl">这个月的续费，都有了答案</div>
    <div class="sub">下一笔要等到 10 月 9 日</div>
  </div>
  <dl class="summary">
    <div><dt>续订</dt><dd>${demo.tally.keep} 笔</dd></div>
    <div><dt>不续了</dt><dd>${demo.tally.cancel} 笔</dd></div>
    <div><dt>稍后再说</dt><dd>${demo.tally.later} 笔</dd></div>
  </dl>
  <div class="total"><span class="cap" style="color:var(--ink)">每月省下</span><span class="num">${savedText()}</span></div>
  <button class="later" data-replay style="margin-top:22px">↻ 重新来一遍</button>`;

const settle=[{opacity:0,transform:"translateY(22px) rotate(-1.2deg)"},{opacity:1,transform:"none"}];
const rise=[{opacity:0,transform:"translateY(8px)"},{opacity:1,transform:"none"}];
window.dockIn=()=>Promise.all([
  play($("#dock").closest(".shadow"),settle,{duration:760}),
  play($("#dock .seal"),[{transform:"scale(1.7) rotate(-28deg)",opacity:0},{transform:"scale(.93) rotate(0)",opacity:1,offset:.7},{transform:"none",opacity:1}],{duration:700,delay:380,easing:EASE.out}),
  play($("#dock .prog i"),[{transform:"scaleX(0)",transformOrigin:"0 50%"},{transform:"none",transformOrigin:"0 50%"}],{duration:900,delay:500}),
  stagger($$("#dock .pend, #dock .sec, #dock .row, #dock .foot"),rise,{gap:34,delay:300,duration:480}),
]);
window.cardIn=(first)=>Promise.all([
  play($("#card").closest(".shadow"),first?settle:[{opacity:0,transform:"rotateX(-14deg) translateY(26px)"},{opacity:1,transform:"none"}],{duration:first?760:620}),
  stagger($$("#card > *"),rise,{gap:45,delay:first?260:160,duration:460}),
]);
const WAX={keep:["续订","renewed"],cancel:["不续","cancelled"],later:["稍后","later"]};
window.cardFx=async(choice)=>{
  const paper=$("#card"),sheet=paper.closest(".shadow");
  paper.insertAdjacentHTML("beforeend",`<div class="wax-ring w-${choice}"></div><div class="wax w-${choice}">${WAX[choice][0]}<small>${WAX[choice][1]}</small></div>`);
  /* drop, squash, settle — then the warm ring spreads */
  await play($(".wax",paper),[
    {transform:"translateY(-40px) scale(1.7) rotate(-34deg)",opacity:0},
    {transform:"translateY(0) scale(.9) rotate(-6deg)",opacity:1,offset:.55},
    {transform:"scale(1.04) rotate(-9deg)",opacity:1,offset:.78},
    {transform:"rotate(-8deg)",opacity:1}],{duration:560,easing:EASE.out,fill:"forwards"});
  play($(".wax-ring",paper),[{transform:"scale(.9)",opacity:.6},{transform:"scale(1.9)",opacity:0}],{duration:700,easing:EASE.out,fill:"forwards"});
  await wait(620);
  /* the receipt is folded away */
  await play(sheet,[{opacity:1,transform:"none"},{opacity:0,transform:"rotateX(24deg) translateY(-26px) scale(.96)"}],{duration:460,easing:EASE.in,fill:"forwards"});
};
window.rowFx=(row,choice)=>choice!=="cancel"&&play($(".nm",row),[{color:`var(--${choice==="keep"?"keep":"gold"})`},{color:"inherit"}],{duration:1400});
/*<motion-core> shared by every receipt preview; each page defines dockHTML/cardHTML/doneHTML and dockIn/cardIn/cardFx/rowFx */
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const wait = (ms) => new Promise((r) => setTimeout(r, RM ? 0 : ms));
const EASE = { out: "cubic-bezier(.2,.8,.2,1)", back: "cubic-bezier(.34,1.56,.64,1)", in: "cubic-bezier(.55,0,.75,.2)", io: "cubic-bezier(.65,0,.35,1)" };
/* Enter animations fill backwards (they hand back to the stylesheet when done); exits pass fill:"forwards". */
function play(el, kf, opts = {}) {
  if (!el) return Promise.resolve();
  const a = el.animate(kf, { duration: 420, easing: EASE.out, fill: "backwards", ...opts, ...(RM ? { duration: 1, delay: 0 } : {}) });
  return a.finished.then(() => a, () => a);
}
const stagger = (els, kf, { gap = 40, delay = 0, ...o } = {}) => Promise.all([...els].map((el, i) => play(el, kf, { ...o, delay: delay + i * gap })));
const fmtNum = (v) => v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function countTo(el, from, to, ms = 900) {
  if (RM) { el.textContent = fmtNum(to); return Promise.resolve(); }
  return new Promise((res) => {
    const t0 = performance.now();
    const tick = (t) => { const k = Math.min(1, (t - t0) / ms); el.textContent = fmtNum(from + (to - from) * (1 - Math.pow(1 - k, 4))); k < 1 ? requestAnimationFrame(tick) : res(); };
    requestAnimationFrame(tick);
  });
}

/* Demo data: the two renewals waiting for a decision */
const RATE = { "US$": 7.12, "¥": 1 };
const cny = (p) => { const m = /^(US\$|¥)([\d.]+)$/.exec(p); return m ? +m[2] * RATE[m[1]] : 0; };
const PENDING = [
  { n: "ChatGPT Plus", b: "#10a37f", l: "C", p: "US$20.00", day: "10-05", dayZh: "10 月 5 日", when: "明天", cyc: "每月", trial: true },
  { n: "Netflix", b: "#e50914", l: "N", p: "US$15.49", day: "10-06", dayZh: "10 月 6 日", when: "后天", cyc: "每月", trial: false },
];
const titleOf = (it) => (it.trial ? `${it.n} 的试用快结束了` : `还在用 ${it.n} 吗？`);
const subOf = (it) => (it.trial ? `${it.when}试用结束，并开始第一次扣费` : `${it.when}自动续费，每月 ${it.p}`);
const statusOf = (it) => (it.trial ? "试用中" : "生效中");
const chargeOf = (it) => (it.trial ? "首次扣费" : "本次扣费");
const MARK = { keep: "已续", cancel: "已取消", later: "稍后" };
const demo = {};
function resetDemo() {
  Object.assign(demo, { remaining: 407.27, monthly: 481.22, queue: PENDING.slice(), index: 0, total: PENDING.length, busy: false, tally: { keep: 0, cancel: 0, later: 0, saved: 0 } });
}
const tallyText = () => [demo.tally.keep && `续 ${demo.tally.keep}`, demo.tally.cancel && `不续 ${demo.tally.cancel}`, demo.tally.later && `稍后 ${demo.tally.later}`].filter(Boolean).join(" · ");
const savedText = () => `≈¥${fmtNum(demo.tally.saved)}`;

/* A decision ripples into the dock: the row, the totals and the pending banner */
async function applyDecision(item, choice) {
  demo.tally[choice]++;
  const jobs = [];
  if (choice === "cancel") {
    const v = cny(item.p);
    demo.tally.saved += v;
    $$("[data-num]").forEach((el) => jobs.push(countTo(el, demo.remaining, demo.remaining - v)));
    $$("[data-monthly]").forEach((el) => jobs.push(countTo(el, demo.monthly, demo.monthly - v)));
    demo.remaining -= v;
    demo.monthly -= v;
  }
  const row = $(`[data-row="${item.n}"]`);
  if (row) {
    row.classList.add("is-" + choice);
    ($("[data-mark]", row) || row).insertAdjacentHTML("beforeend", `<i class="mk mk-${choice}">${MARK[choice]}</i>`);
    jobs.push(Promise.resolve(window.rowFx?.(row, choice, item)));
  }
  jobs.push(updatePending());
  await Promise.all(jobs);
}
async function updatePending() {
  const banner = $("[data-pending]");
  if (!banner) return;
  const left = demo.queue.slice(1);
  const count = $("[data-pcount]", banner);
  await play(count, [{ transform: "none", opacity: 1 }, { transform: "translateY(-80%)", opacity: 0 }], { duration: 170, easing: EASE.in, fill: "forwards" });
  if (left.length) {
    count.textContent = left.length;
    $("[data-pnames]", banner).textContent = left.map((x) => x.n).join("、");
  } else {
    banner.classList.add("done");
    count.textContent = "✓";
    $("[data-ptext]", banner).textContent = "都处理好了";
    $("[data-pnames]", banner).textContent = tallyText();
  }
  count.getAnimations().forEach((a) => a.cancel());
  await play(count, [{ transform: "translateY(80%)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 340, easing: EASE.back });
}

async function decide(choice, btn) {
  if (demo.busy || !demo.queue.length) return;
  demo.busy = true;
  const item = demo.queue[0];
  const fx = applyDecision(item, choice);
  await window.cardFx(choice, btn, item);
  demo.queue.shift();
  demo.index++;
  renderCard();
  $(".card-w").getAnimations({ subtree: true }).forEach((a) => a.cancel());
  await Promise.all([window.cardIn(false), fx]);
  demo.busy = false;
}
function renderCard() {
  const el = $("#card");
  el.innerHTML = demo.queue.length ? cardHTML(demo.queue[0]) : doneHTML();
  $$("[data-choice]", el).forEach((b) => (b.onclick = () => decide(b.dataset.choice, b)));
  $("[data-replay]", el)?.addEventListener("click", () => replay());
}
const nudge = (el) => play(el, [{ transform: "none" }, { transform: "translateX(-7px)" }, { transform: "translateX(6px)" }, { transform: "translateX(-3px)" }, { transform: "none" }], { duration: 420, easing: "linear" });
async function replay() {
  resetDemo();
  document.getAnimations().forEach((a) => a.cancel());
  $("#dock").innerHTML = dockHTML();
  $("[data-pending]")?.addEventListener("click", () => nudge($(".card-w")));
  renderCard();
  $(".stage").style.visibility = "visible";
  $$("[data-num]").forEach((el) => countTo(el, 0, demo.remaining, 1100));
  $$("[data-monthly]").forEach((el) => countTo(el, 0, demo.monthly, 1100));
  await Promise.all([window.dockIn(), window.cardIn(true)]);
}

/* Light/dark with a circular reveal from wherever the switch happened */
const root = document.documentElement;
const params = new URLSearchParams(location.search);
if (window.top !== window || params.has("embed")) root.classList.add("embedded");
function setMode(m, origin) {
  const apply = () => { root.dataset.mode = m; $$(".seg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.m === m)); };
  if (root.dataset.mode === m || !document.startViewTransition || RM) return apply();
  root.style.setProperty("--vx", origin ? origin.x + "px" : "100%");
  root.style.setProperty("--vy", origin ? origin.y + "px" : "0px");
  document.startViewTransition(apply);
}
$$(".seg button").forEach((b) => (b.onclick = (e) => setMode(b.dataset.m, { x: e.clientX, y: e.clientY })));
addEventListener("message", (e) => {
  const d = e.data || {};
  if (d.type === "mode") setMode(d.mode, d.origin);
  if (d.type === "replay") replay();
});
/* inside the index page, shortcut keys go to the switcher */
if (root.classList.contains("embedded")) addEventListener("keydown", (e) => {
  if (!e.metaKey && !e.ctrlKey && !e.altKey && /^(ArrowLeft|ArrowRight|[1-5]|r|R|d|D)$/.test(e.key)) parent.postMessage({ type: "key", key: e.key }, "*");
});
root.dataset.mode = params.has("dark") ? "dark" : "light";
$$(".seg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.m === root.dataset.mode));
Promise.race([document.fonts.ready, wait(800)]).then(replay);
/*</motion-core>*/
</script>
</body>
</html>
